<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Interactive Exoplanet Map</title>
  <meta
    name="description"
    content="NASA Space Apps 2024 prototype: interactive canvas map for exploring exoplanets using RA/DEC data and sky-map layers."
  />

  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <main class="app">
    <canvas id="exoplanetMap" aria-label="Interactive exoplanet sky map"></canvas>

    <section id="planet-info" class="popup" aria-live="polite"></section>

    <section class="layer-buttons" aria-label="Map layer controls">
      <button id="switchLayerButton" type="button">Switch Layer</button>
      <button id="toggleConstellationsButton" type="button">Toggle Constellations</button>
    </section>

    <section class="zoom-buttons" aria-label="Zoom controls">
      <button id="zoomInButton" type="button">Zoom In</button>
      <button id="zoomOutButton" type="button">Zoom Out</button>
    </section>

    <section class="nav-buttons" aria-label="Pan controls">
      <button id="panUpButton" type="button" aria-label="Pan up">▲</button>
      <div class="nav-buttons-row">
        <button id="panLeftButton" type="button" aria-label="Pan left">◀</button>
        <button id="panDownButton" type="button" aria-label="Pan down">▼</button>
        <button id="panRightButton" type="button" aria-label="Pan right">▶</button>
      </div>
    </section>

    <canvas id="minimapCanvas" width="220" height="110" aria-label="Map minimap"></canvas>

    <div id="loadingStatus" class="status">Loading exoplanet map...</div>
  </main>

  <script src="src/script.js"></script>
</body>
</html>
